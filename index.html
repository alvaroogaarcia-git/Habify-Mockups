<!DOCTYPE html>
<html lang="es">
<head>

    <!-- Configuracion basica html -->
    <meta charset="UTF 8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    <title>HABIFY - Prototípo de Pantallas App</title>

    <!-- TAILWIND CSS: Framework de estilos -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fuentes de Google con PlusJakarta Sans para Títulos e Inter para Textos-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!--Iconos-->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>    
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            emerald: '#0D9488',
                            navy: '#0F172A',
                            mint: '#10B981',
                            light: '#F8FAFC',
                            accent: '#14B8A6'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        title: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #334155;
        }
        .font-heading {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Estilo marco móvil */
        .phone-frame {
            width: 375px; /*Ancho pantalla de móvil */
            height: 760px; /*Alto pantalla de móvil */
            border-radius: 40px; /* Bordes redondeados */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 12px #1E293B; /*Sombras*/
            overflow: hidden; /*Evita que se salga el contenido*/
            position: relative;
        }
    </style>
</head>   

<body class="bg-slate-900 text-slate-100 min-h-screen p-8 flex flex-col items-center justify-center font-sans">
    <!-- Cabecera de Documento-->
     <header class="text-center mb-10 max-w-2xl">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-500/10 border border-teal-500/20 text-teal-400 text-xs font-semibold uppercase tracking-wider mb-3">
      <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> Prototipos de Pantalla UI/UX
    </div>
    <h1 class="text-3xl font-extrabold font-heading text-white tracking-tight">
      HABIFY <span class="text-teal-400">Mobile Interface</span>
    </h1>
    <p class="text-slate-400 text-xs mt-1">
      Diseño visual de pantallas clave para la Memoria Técnica en PDF (Universidad de Deusto)
    </p>
     </header>
</body>
</html>
